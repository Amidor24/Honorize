name: Dev → Test Pipeline

on:
  push:
    branches:
      - dev

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node (or Python, etc.)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  deploy-to-test:
    name: Deploy to Test Branch
    runs-on: ubuntu-latest
    needs: run-tests  # Runs ONLY if tests passed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev  # take the code from dev branch

      - name: Push changes to test branch
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git fetch
          git checkout test
          git merge dev --no-ff -m "Auto-merge dev → test [skip ci]"
          git push origin test
