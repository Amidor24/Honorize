name: Dev → Test Pipeline

on:
  push:
    branches:
      - dev  # Trigger on changes to dev branch

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git merge later

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'  # Change to your .NET SDK version

      # - name: Restore dependencies
      #   run: dotnet restore Honorise/Backend/Backend.sln

      - name: Build
        run: dotnet build Honorise/Backend/Backend.sln --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Tests
        run: dotnet test Honorise/Backend/*Tests/*.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

  deploy:
    name: Deploy to Test Branch
    runs-on: ubuntu-latest
    needs: test
    if: success()  # Only run if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into test
        run: |
          git checkout test
          git merge origin/dev --no-ff -m "Automated merge from dev to test"
          git push origin test
