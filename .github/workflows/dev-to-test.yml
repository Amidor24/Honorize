name: Dev → Test Pipeline

on:
  push:
    branches:
      - dev

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # or your version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release

  deploy-to-test:
    name: Deploy to Test Branch
    runs-on: ubuntu-latest
    needs: run-tests   # Only run if tests passed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Push changes to test branch
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git fetch
          git checkout test
          git merge dev --no-ff -m "Auto-merge dev → test [skip ci]"
          git push origin test

